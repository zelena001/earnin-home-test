name: Playwright Tests

on:
  # Run automatically on push or PR
  pull_request:
    branches: [  development ]

  # ✅ Allow manual trigger from GitHub UI
  workflow_dispatch:
    inputs:
      target_branch:
        description: 'Branch to run tests on'
        required: false
        default: 'development'
      test_pattern:
        description: 'Optional test filter (regex, e.g. tests/community/*.spec.ts)'
        required: false
        default: ''

jobs:
  e2e-tests:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Checkout repo
      - name: Checkout repository
        uses: actions/checkout@v3

      # 2️⃣ Set up Docker Buildx for caching
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      # 3️⃣ Restore Docker cache (optional, speeds up rebuilds)
      - name: Cache Docker layers
        uses: actions/cache@v3
        with:
          path: /tmp/.buildx-cache
          key: ${{ runner.os }}-docker-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-docker-

      # 4️⃣ Build Docker image with caching
      - name: Build Docker image
        run: |
          docker buildx build \
            --cache-from=type=local,src=/tmp/.buildx-cache \
            --cache-to=type=local,dest=/tmp/.buildx-cache-new,mode=max \
            -t playwright-tests .

      # 5️⃣ Replace old cache with new cache
      - name: Update Docker cache
        run: rm -rf /tmp/.buildx-cache && mv /tmp/.buildx-cache-new /tmp/.buildx-cache

      # 6️⃣ Run Playwright tests inside container
      - name: Run Playwright tests
        run: docker run --rm \
              -v ${{ github.workspace }}/test-results:/app/test-results \
              playwright-tests

      # 7️⃣ Upload test artifacts
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: test-results
          path: test-results/