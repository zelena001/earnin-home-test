name: Playwright Tests

on:
  pull_request:
    branches: [development]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  e2e-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t playwright-tests .

      - name: Prepare report folder
        run: mkdir -p ${{ github.workspace }}/playwright-report

      - name: Run Playwright tests
        run: |
          docker run --rm \
            -v ${{ github.workspace }}/playwright-report:/app/playwright-report \
            playwright-tests \
            npx playwright test 

      - name: Upload Playwright Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/

  publish-report:
    if: always()
    needs: e2e-tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download Playwright Report
        uses: actions/download-artifact@v4
        with:
          name: playwright-report
          path: playwright-report

      # 🧹 Cleanup: Keep only the latest 5 reports
      - name: Clean up old reports
        run: |
          git fetch origin gh-pages || echo "No gh-pages branch yet"
          git checkout gh-pages || git checkout --orphan gh-pages
          mkdir -p reports
          cd reports
          echo "Keeping only the 5 most recent reports..."
          ls -t | tail -n +6 | xargs -r rm -rf
          cd ..
          # ✅ Add redirect index.html for convenience
          echo '<meta http-equiv="refresh" content="0; url=reports/latest/">' > index.html
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add reports index.html || true
          git commit -m "Cleanup old reports" || echo "Nothing to clean"
          git push origin gh-pages || echo "No gh-pages yet"

      # 🚀 Deploy: Store new report under reports/<run_number>/
      - name: Deploy Playwright report (versioned)
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: playwright-report
          destination_dir: reports/${{ github.run_number }}
          keep_files: true  # ✅ Keeps existing older reports
          
      - name: 📣 Display report link
        run: |
          echo ""
          echo "✅ Playwright HTML report has been published!"
          echo "👉 https://zelena001.github.io/earnin-home-test/reports/${{ github.run_number }}/"
          echo ""
          