name: Playwright Tests

on:
  pull_request:
    branches: [development]

  workflow_dispatch:
    inputs:
      target_branch:
        description: 'Branch to run tests on'
        required: false
        default: 'development'
      test_pattern:
        description: 'Optional test filter (regex, e.g. tests/community/*.spec.ts)'
        required: false
        default: ''

jobs:
  e2e-tests:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write 

    steps:
      # 1️⃣ Checkout repo
      - name: Checkout repository
        uses: actions/checkout@v3

      # 2️⃣ Run Playwright tests in official Docker image
      - name: Build Docker image
        run: docker build -t playwright-tests .

      - name: Run Playwright tests
        run: docker run --rm playwright-tests

      # 3️⃣ Upload test artifacts
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test-results/
