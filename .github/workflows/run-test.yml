name: Playwright Tests

on:
  pull_request:
    branches: [development]
  workflow_dispatch:

permissions:
  contents: write     # ✅ Required for deploying to gh-pages

jobs:
  # 🧪 Run Playwright tests
  e2e-tests:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Checkout repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2️⃣ Build Docker image
      - name: Build Docker image
        run: docker build -t playwright-tests .

      # 3️⃣ Prepare report folder
      - name: Prepare report folder
        run: mkdir -p ${{ github.workspace }}/playwright-report

      # 4️⃣ Optional: Debug container
      - name: Debug container
        run: docker run --rm playwright-tests ls -l /app/node_modules/.bin

      # 5️⃣ Run Playwright tests (Docker)
      - name: Run Playwright tests
        run: |
          docker run --rm \
            -v ${{ github.workspace }}/playwright-report:/app/playwright-report \
            playwright-tests

      # 6️⃣ Upload Playwright Report as artifact
      - name: Upload Playwright Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/

  # 🌐 Deploy HTML report to GitHub Pages
  publish-report:
    if: always()
    needs: e2e-tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download Playwright Report
        uses: actions/download-artifact@v4
        with:
          name: playwright-report
          path: playwright-report

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: playwright-report
