name: Playwright Tests

on:
  pull_request:
    branches: [development]
  workflow_dispatch:

jobs:
  e2e-tests:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Checkout repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2️⃣ Build Docker image
      - name: Build Docker image
        run: docker build -t playwright-tests .

      - name: Prepare report folder
        run: mkdir -p ${{ github.workspace }}/playwright-report

      - name: Debug container
        run: docker run --rm playwright-tests ls -l /app/node_modules/.bin

      # - name: Run Playwright tests
      #   run: |
      #     docker run --rm playwright-tests

      - name: Run Playwright tests
        run: |
          docker run --rm -v ${{ github.workspace }}/playwright-report:/app/playwright-report playwright-tests


      # 4️⃣ Upload test results
      - name: Upload Playwright Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
